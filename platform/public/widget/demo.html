<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatPod Widget — דמו</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Heebo', sans-serif; margin: 0; background: #faf9f6; direction: rtl; }
    .hero { max-width: 800px; margin: 80px auto; text-align: center; padding: 0 24px; }
    .hero h1 { font-size: 42px; font-weight: 900; margin-bottom: 16px; }
    .hero p { font-size: 18px; color: #666; line-height: 1.7; margin-bottom: 32px; }
    .badge { display: inline-block; background: #fffbeb; border: 1px solid #c9a227; color: #7a5e0a; padding: 6px 18px; border-radius: 20px; font-size: 14px; font-weight: 600; margin-bottom: 20px; }
    .products-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 900px; margin: 60px auto; padding: 0 24px; }
    .product-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; overflow: hidden; }
    .product-card img { width: 100%; height: 180px; object-fit: cover; }
    .product-card-info { padding: 14px; }
    .product-card-name { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .product-card-price { font-size: 16px; font-weight: 800; color: #c9a227; }
    .note { text-align: center; color: #9ca3af; font-size: 13px; padding: 40px; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="badge">✨ דמו חי — ChatPod AI Widget</div>
    <h1>שמחת הבקעה 🌾</h1>
    <p>חנות תמרים ומוצרי גורמה ישראליים.<br/>לחץ על כפתור הצ'אט בפינה השמאלית התחתונה כדי לדבר עם הסוכן.</p>
  </div>

  <div class="products-grid" id="productsGrid">
    <div class="note">טוען מוצרים...</div>
  </div>

  <script>
    fetch('/api/products')
      .then(r => r.json())
      .then(products => {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = products.map(p => `
          <div class="product-card">
            <img src="${p.image}" alt="${p.name}" loading="lazy" />
            <div class="product-card-info">
              <div class="product-card-name">${p.name}</div>
              <div class="product-card-price">₪${p.price}</div>
            </div>
          </div>
        `).join('');
      })
      .catch(() => {
        document.getElementById('productsGrid').innerHTML = '<div class="note">לא ניתן לטעון מוצרים</div>';
      });
  </script>

  <!-- ChatPod Widget -->
  <script src="/widget/chatpod-widget.js" data-store="demo-store"></script>
</body>
</html>
